[package]
name = "cronwhen"
version = "0.1.0"
edition = "2021"
description = "Explains a cron expression in plain English and lists its next run times — no crontab.guru round-trip needed"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/cronwhen"
readme = "README.md"
keywords = ["cron", "schedule", "cli", "crontab"]
categories = ["command-line-utilities", "date-and-time"]

[lib]
name = "cronwhen"
path = "src/lib.rs"

[[bin]]
name = "cronwhen"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
